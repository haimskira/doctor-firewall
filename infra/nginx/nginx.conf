# Doctor Firewall — UI + API gateway (the only published service).
# Runs as an unprivileged user (nginx-unprivileged image) on a read-only root FS.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Access log without cookies, auth headers or query strings.
    log_format main escape=json '{"ts":"$time_iso8601","ip":"$remote_addr",'
                                '"method":"$request_method","path":"$uri","status":$status,'
                                '"bytes":$body_bytes_sent,"rt":$request_time,'
                                '"request_id":"$sent_http_x_request_id"}';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Brute-force damping on login (the API also locks accounts).
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    # Docker's DNS: re-resolve "api" so a recreated API container (new address) is found
    # without restarting the gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/ui.pem;
        ssl_certificate_key /etc/nginx/tls/ui.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        ssl_session_cache shared:SSL:10m;

        # Security headers for everything served here (locations below never use
        # add_header, so these are always inherited).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append) so clients cannot spoof their address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        # The API sets these too (so it is safe without nginx); drop its copies so
        # browsers see exactly one of each, the ones defined above.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_read_timeout 120s;

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api;
        }

        location /api/ {
            proxy_pass http://api;
        }

        # Hashed, immutable build assets.
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            expires -1;
            try_files $uri /index.html;
        }
    }
}
